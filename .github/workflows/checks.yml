name: Local checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B skills/bot-orchestrator/scripts/test_board.py
      - run: python -B skills/bot-orchestrator/scripts/test_moa.py
      - run: python -B scripts/test_repository.py
      - run: python -B scripts/check_repository.py
      - run: python -B examples/local_demo.py
      - run: python -B examples/moa_demo.py
